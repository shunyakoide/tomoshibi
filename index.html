<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0c0d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Browser generator for the 3D-printable forming mold used to build AKARI-style washi paper lanterns." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lamp Kit Generator — Harigata Studio</title>
    <script>
      // Diagnostics: show the actual error on screen instead of a black page.
      // Registered before the module loads, so it also catches bundle evaluation errors.
      (function () {
        function show(title, detail) {
          var r = document.getElementById("root");
          if (!r) return;
          // React overwrites #root once it mounts successfully.
          // If this text remains, it means the JS never ran.
          r.innerHTML =
            '<div style="position:fixed;inset:0;padding:20px;overflow:auto;' +
            'font:13px/1.5 ui-monospace,monospace;color:#e8e8ec;background:#0c0c0d;' +
            '-webkit-user-select:text;user-select:text;z-index:99999">' +
            '<div style="color:#e0a060;font-weight:600;margin-bottom:8px">⚠ ' +
            title +
            '</div><pre style="white-space:pre-wrap;word-break:break-word;margin:0">' +
            (detail || "").replace(/</g, "&lt;") +
            "</pre></div>";
        }
        window.addEventListener("error", function (e) {
          show(
            "Error: " + (e.message || "unknown"),
            (e.filename || "") + (e.lineno ? ":" + e.lineno : "") + "\n" +
              (e.error && e.error.stack ? e.error.stack : "")
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          var reason = e.reason || {};
          show(
            "Unhandled promise: " + (reason.message || String(reason)),
            reason.stack || ""
          );
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #6f6f7a;
          font: 13px/1.5 ui-monospace, monospace;
          background: #0c0c0d;
        "
      >
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
